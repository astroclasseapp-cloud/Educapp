<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Educapp</title>
<style>
  :root { --blue: #1769e0; --cyan: #11c5df; --ink: #1d2940; --muted: #71809a; --line: #e3eaf4; }
  * { box-sizing: border-box; }
  body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: hidden; color: var(--ink); font-family: "Segoe UI", Arial, sans-serif; background: #f5f8fc; }
  body::before, body::after { content: ""; position: fixed; z-index: 0; border-radius: 50%; pointer-events: none; }
  body::before { top: -180px; right: -130px; width: 430px; height: 430px; background: #dff7fa; animation: float 9s ease-in-out infinite alternate; }
  body::after { bottom: -220px; left: -150px; width: 500px; height: 500px; background: #e7efff; animation: float 11s ease-in-out -3s infinite alternate-reverse; }
  .loading { position: relative; z-index: 1; width: min(88vw, 410px); padding: 42px 42px 36px; text-align: center; background: #fff; border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 18px 50px rgba(42, 75, 125, .12); animation: enter 600ms ease-out both; }
  .loading.leaving { animation: leave 360ms cubic-bezier(.55, 0, .8, .35) both; }
  .logo { width: 104px; height: 104px; margin: 0 auto 24px; padding: 10px; display: grid; place-items: center; background: #fff; border: 1px solid #edf1f7; border-radius: 28px; box-shadow: 0 10px 25px rgba(23, 105, 224, .12); animation: logo-in 700ms 120ms ease-out both; }
  .logo img { width: 100%; height: 100%; object-fit: contain; border-radius: 20px; }
  .tagline { margin: 0 0 8px; color: var(--blue); font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
  h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -1px; }
  #status { min-height: 21px; margin: 12px 0 29px; color: var(--muted); font-size: 14px; transition: opacity 180ms ease; }
  #status.changing { opacity: 0; }
  .track { height: 6px; overflow: hidden; border-radius: 99px; background: #e8edf5; }
  .bar { width: 36%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--blue), var(--cyan)); animation: progress 1.7s ease-in-out infinite; }
  .bar.downloading { width: 0; animation: none; transition: width 180ms ease-out; }
  .dots { display: flex; justify-content: center; gap: 6px; margin-top: 20px; }
  .dots span { width: 5px; height: 5px; border-radius: 50%; background: #b9c6d8; animation: dot 1.1s ease-in-out infinite; }
  .dots span:nth-child(2) { animation-delay: 140ms; }
  .dots span:nth-child(3) { animation-delay: 280ms; }
  .footer { margin: 25px 0 0; color: #a0acbe; font-size: 11px; }
  @keyframes enter { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes leave { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(-12px) scale(.98); } }
  @keyframes logo-in { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: scale(1); } }
  @keyframes progress { 0% { transform: translateX(-125%); } 55% { transform: translateX(175%); } 100% { transform: translateX(290%); } }
  @keyframes dot { 0%, 100% { opacity: .4; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); background: var(--blue); } }
  @keyframes float { to { transform: translate(20px, 15px); } }
  @media (max-width: 480px) { .loading { padding: 34px 26px 30px; } .logo { width: 88px; height: 88px; border-radius: 23px; } h1 { font-size: 30px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; } }
</style>
</head>
<body>
  <main class="loading" aria-live="polite">
    <div class="logo"><img src="icon.png" alt="Logo Educapp"></div>
    <p class="tagline">Apprendre autrement</p>
    <h1>Educapp</h1>
    <p id="status">Préparation de votre espace...</p>
    <div class="track" role="progressbar" aria-label="Téléchargement"><div class="bar"></div></div>
    <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
    <p class="footer" id="percent">Téléchargement en cours...</p>
  </main>
  <script>
    const status = document.getElementById("status");
    const bar = document.querySelector(".bar");
    const percent = document.getElementById("percent");
    function setStatus(message) {
      status.classList.add("changing");
      setTimeout(() => { status.textContent = message; status.classList.remove("changing"); }, 180);
    }
    const { ipcRenderer } = require("electron");
    ipcRenderer.on("update-status", (_event, message) => setStatus(message));
    ipcRenderer.on("update-progress", (_event, value) => {
      const progress = Math.max(0, Math.min(100, Number(value) || 0));
      bar.classList.add("downloading");
      bar.style.width = `${progress}%`;
      percent.textContent = `Téléchargement : ${Math.round(progress)} %`;
    });
    ipcRenderer.on("open-app", () => {
      const loading = document.querySelector(".loading");
      loading.classList.add("leaving");
      setTimeout(() => { window.location.href = "index.html"; }, 360);
    });
  </script>
</body>
</html>
